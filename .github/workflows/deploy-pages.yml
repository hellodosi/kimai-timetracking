name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Basis-Pfad für den Build (Standard "./" für universelle Portabilität auf Hauptdomain & Unterverzeichnis)'
        required: false
        default: './'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build applet
        run: |
          # 1. Manuelle Workflow-Eingabe (falls per Hand gestartet)
          # 2. Repository-Variable 'BASE_URL' (falls in GitHub Settings > Secrets and Variables hinterlegt)
          # 3. Standard './' (relativ): Funktioniert automatisch sowohl auf der Hauptdomain als auch in Unterverzeichnissen
          BASE="${{ inputs.base_url || vars.BASE_URL }}"
          if [ -z "$BASE" ]; then
            BASE="./"
          fi
          echo "Building PWA with base path: ${BASE}"
          npm run build -- --base="${BASE}"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

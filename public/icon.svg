<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Dial Ring -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#1e293b" stroke-width="24" opacity="0.8" />
  <circle cx="256" cy="270" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-dasharray="750 300" stroke-linecap="round" filter="url(#glow)" />

  <!-- Stopwatch Top Stem & Button -->
  <rect x="236" y="60" width="40" height="38" rx="8" fill="#38bdf8" />
  <rect x="216" y="44" width="80" height="20" rx="10" fill="#bae6fd" />
  
  <!-- Center Play / Clock Arrow -->
  <g transform="translate(256, 270)">
    <!-- Clock Center Dot -->
    <circle cx="0" cy="0" r="14" fill="#f8fafc" />
    <!-- Clock Hands (10 past 10) -->
    <line x1="0" y1="0" x2="-35" y2="-65" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
    <line x1="0" y1="0" x2="65" y2="-20" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    
    <!-- Sync indicator badge in lower right -->
    <g transform="translate(65, 65)">
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#34d399" stroke-width="6" />
      <!-- Sync arrows icon -->
      <path d="M-18 -8 A 18 18 0 0 1 14 -12 L 18 -18 L 18 0 L 0 0 L 8 -8 A 12 12 0 0 0 -12 -6 Z" fill="#34d399" />
      <path d="M18 8 A 18 18 0 0 1 -14 12 L -18 18 L -18 0 L 0 0 L -8 8 A 12 12 0 0 0 12 6 Z" fill="#34d399" />
    </g>
  </g>

  <!-- Offline Lock Shield Icon in Top Left -->
  <g transform="translate(100, 110)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
    <!-- Shield / Lock -->
    <path d="M-12 -6 C-12 -6 0 -14 0 -14 C0 -14 12 -6 12 -6 C12 6 8 16 0 20 C-8 16 -12 6 -12 -6 Z" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
    <circle cx="0" cy="4" r="3" fill="#38bdf8" />
  </g>
</svg>
